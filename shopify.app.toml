# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "70fc9f74b44278acbf6521280e095fd3"
name = "eyequipment-b2b"
application_url = "https://example.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_publications,write_publications,read_quick_sale"

[product.metafields.app.source_product]
type = "product_reference"
name = "B2B source product"
description = "Links a generated B2B bundle to its original B2C product"

  [product.metafields.app.source_product.access]
  admin = "merchant_read_write"

[product.metafields.app.source_updated_at]
type = "date_time"
name = "B2B source last synchronized"
description = "Stores the source product timestamp from the last successful B2B synchronization"

  [product.metafields.app.source_updated_at.access]
  admin = "merchant_read_write"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
